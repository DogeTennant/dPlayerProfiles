# English (United States) translation file.
# Supports MiniMessage tags and legacy & color codes.
# Available placeholders are noted per message.

# General
prefix: "<gradient:#a855f7:#ec4899><bold>dProfiles</bold></gradient> <dark_gray>»</dark_gray>"
no-permission: "{prefix} <red>You don't have permission to do that."
player-only: "{prefix} <red>This command can only be run by a player."
unknown-command: "{prefix} <red>Unknown subcommand. Use <white>/dp help</white> for a list."
player-not-found: "{prefix} <red>Player <white>{player}</white> has not played on this server."
