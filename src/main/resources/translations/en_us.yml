# Language command
cmd-language-usage: "{prefix} <red>Usage: /dp language <code>"
cmd-language-success: "{prefix} <green>Language switched to <white>{code}</white>."
cmd-language-not-found: "{prefix} <red>No language file found for <white>{code}</white>."

# Reset commands
cmd-reset-usage: "{prefix} <red>Usage: /dp reset <player>"
cmd-reset-success: "{prefix} <green>All data for <white>{player}</white> has been reset."
cmd-resetach-usage: "{prefix} <red>Usage: /dp resetach <player> <achievement>"
cmd-resetach-success: "{prefix} <green>Achievement <white>{achievement}</white> reset for <white>{player}</white>."
cmd-resetach-not-found: "{prefix} <red>Achievement <white>{achievement}</white> does not exist."

# Complete command
cmd-complete-usage: "{prefix} <red>Usage: /dp complete <player> <achievement>"
