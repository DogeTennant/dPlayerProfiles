cmd-badge-not-found: "{prefix} <red>Badge <white>{badge}</white> does not exist."
cmd-badge-already-has: "{prefix} <yellow><white>{player}</white> already has that badge."
cmd-badge-doesnt-have: "{prefix} <yellow><white>{player}</white> does not have that badge."

