# Russian (Russia) translation file.
# Supports MiniMessage tags and legacy & color codes.
# Available placeholders are noted per message.

# General
prefix: "<gradient:#a855f7:#ec4899><bold>dProfiles</bold></gradient> <dark_gray>»</dark_gray>"
no-permission: "{prefix} <red>Нэт прав."
player-only: "{prefix} <red>Эта команда для игрока."
unknown-command: "{prefix} <red>Непонятная сабкоманда. <white>/dp help</white> в помощь."
player-not-found: "{prefix} <red>Игрок <white>{player}</white> на сервер не заходил."
reload-success: "{prefix} <green>Конфиг и язык перезагружены."

# Language command
cmd-language-usage: "{prefix} <red>Пример использования: /dp language <файлик>"
cmd-language-success: "{prefix} <green>Язык свитчнут на <white>{code}</white>."
cmd-language-not-found: "{prefix} <red>Файл перевода не найден для <white>{code}</white>."

# Reset commands
cmd-reset-usage: "{prefix} <red>Пример использования: /dp reset <игрок>"
cmd-reset-success: "{prefix} <green>Все данные про <white>{player}</white> стёрты."
cmd-resetach-usage: "{prefix} <red>Пример использования: /dp resetach <игрок> <ачивка>"
cmd-resetach-success: "{prefix} <green>Ачивка <white>{achievement}</white> изъята у <white>{player}</white>."
cmd-resetach-not-found: "{prefix} <red>Ачивки <white>{achievement}</white> не существует."

# Complete command
cmd-complete-usage: "{prefix} <red>Пример использования: /dp complete <игрок> <ачивка>"
cmd-complete-success: "{prefix} <green>Ачивка <white>{achievement}</white> начислена игроку <white>{player}</white>."
cmd-complete-already: "{prefix} <yellow><white>{player}</white> уже получил эту ачивку."
cmd-complete-not-found: "{prefix} <red>Ачивки <white>{achievement}</white> не существует."

# Badge commands
cmd-badge-usage: "{prefix} <red>Пример использования: /dp badge give|remove <игрок> <баджик>"
cmd-badge-give-success: "{prefix} <green>Баджик <white>{badge}</white> присвоен игроку <white>{player}</white>."
cmd-badge-remove-success: "{prefix} <green>Баджик <white>{badge}</white> изъят у игрока <white>{player}</white>."
cmd-badge-not-found: "{prefix} <red>Баджика <white>{badge}</white> не существует."
cmd-badge-already-has: "{prefix} <yellow><white>{player}</white> уже имеет этот баджик."
cmd-badge-doesnt-have: "{prefix} <yellow><white>{player}</white> не имеет такого баджика."

cmd-migrate-players-online: "{prefix} <red>Миграцию можно запустить только когда на сервере нет игроков (их профили загружены в память). Кикните всех или используйте техперерыв."
cmd-migrate-no-source: "{prefix} <red>Нечего мигрировать: <white>{file}</white> не существует."
cmd-migrate-no-tables: "{prefix} <red>В {source} не найдено таблиц dPlayerProfiles."
cmd-migrate-several-sets: "{prefix} <yellow>В {source} несколько наборов таблиц (<white>{prefixes}</white>) - объединяю все."
cmd-migrate-add-needs-prefix: "{prefix} <red>'add' должен знать, какой набор таблиц содержит новые данные, но в {source} их несколько (<white>{prefixes}</white>). Выполните <white>/dp migrate <префикс таблиц> add</white> (<white>none</white> = без префикса) для набора, который начинался пустым."
cmd-migrate-target-mismatch: "{prefix} <red>Таблицы в {target} с префиксом <white>{table_prefix}</white> не являются таблицами dPlayerProfiles - они принадлежат другому плагину. Наборы таблиц dPlayerProfiles в {target}: <white>{prefixes}</white>. Исправьте storage.table-prefix в config.yml и перезапустите сервер."
cmd-migrate-started: "{prefix} <yellow>Миграция профилей из <white>{source}</white> в <white>{target}</white>... выполняется в фоне."
cmd-migrate-success: "{prefix} <green>Миграция завершена: объединено <white>{players}</white> игроков, <white>{achievements}</white> записей достижений, <white>{badges}</white> баджиков (префикс исходных таблиц: <white>{tables}</white>)."
cmd-migrate-failed: "{prefix} <red>Миграция не удалась - подробности в консоли."

cmd-webstats-usage: "{prefix} <red>Пример использования: /dp webstats backfill"
cmd-webstats-disabled: "{prefix} <red>Экспорт веб-статистики выключен. Установите <white>web-stats.enabled: true</white> в config.yml и выполните /dp reload."
cmd-webstats-already-running: "{prefix} <yellow>Импорт уже выполняется."
cmd-webstats-backfill-started: "{prefix} <yellow>Импортирую офлайн-игроков и обновляю балансы в фоне..."
cmd-webstats-backfill-done: "{prefix} <green>Импорт завершён: импортировано <white>{players}</white> игроков, обновлено <white>{balances}</white> балансов."

